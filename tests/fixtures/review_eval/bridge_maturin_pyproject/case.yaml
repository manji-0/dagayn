description: Changes [tool.maturin] module-name in pyproject.toml (EXACT bridge to rust/Cargo.toml) without
  touching the Rust side.
negative: false
commit_change: true
base:
  from: py_rust_bridge
change:
  files:
    pyproject.toml: |
      [build-system]
      requires = ["maturin>=1.9,<2"]
      build-backend = "maturin"

      [project]
      name = "demo-native"
      version = "0.1.0"
      requires-python = ">=3.12"

      [tool.maturin]
      manifest-path = "rust/Cargo.toml"
      module-name = "demo_native._native"
expected_findings:
- kind: bridge_touched
  target: rust/Cargo.toml
