    pkg/util.py: |
      def helper(x):
          """Add one to x."""
          return x + 1


      def legacy(x, factor=2):
          return x * factor


      def format_total(values, separator):
          total = sum(values)
          return separator.join([str(value) for value in values]) + " = " + str(total)
