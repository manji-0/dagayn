description: Points the Lambda handler in infra/main.tf at another function of app/hello.py
  (HIGH bridge to app/hello.py::main) without touching app/hello.py.
negative: false
commit_change: false
base:
  from: tf_bridge
  files:
    infra/main.tf: |
      resource "aws_lambda_function" "auth" {
        filename = "${path.module}/../app/hello.py"
        handler  = "hello.legacy"
        runtime  = "python3.12"
        role     = "arn:aws:iam::123456789012:role/lambda"
      }
    app/hello.py: |
      def main(event=None, context=None):
          return {"ok": True}


      def legacy(event=None, context=None):
          return {"ok": False}
change:
  files:
    infra/main.tf: |
      resource "aws_lambda_function" "auth" {
        filename = "${path.module}/../app/hello.py"
        handler  = "hello.main"
        runtime  = "python3.12"
        role     = "arn:aws:iam::123456789012:role/lambda"
      }
expected_findings:
- kind: bridge_touched
  target: app/hello.py::main
  also:
  - app/hello.py
