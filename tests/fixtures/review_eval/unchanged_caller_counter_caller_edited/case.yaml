description: Adds a required parameter to pkg/util.py::legacy and updates its only caller in the same
  change.
negative: false
commit_change: false
base:
  from: py_pkg
change:
  files:
    pkg/util.py: |
      def helper(x):
          """Add one to x."""
          return x + 1


      def legacy(x, factor):
          return x * factor


      def format_total(values, separator):
          total = sum(values)
          return separator.join([str(value) for value in values]) + " = " + str(total)
    pkg/app.py: |
      from pkg.util import format_total, helper, legacy


      def run():
          return helper(1) + legacy(2, 2)


      def summary():
          return format_total([1, 2, 3], ", ")
expected_findings:
- kind: untested_change
