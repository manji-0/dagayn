description: Reflows format_total's long return across lines and normalises blank lines; same tokens.
negative: true
commit_change: true
base:
  from: py_pkg
change:
  files:
    pkg/util.py: |
      def helper(x):
          """Add one to x."""
          return x + 1


      def legacy(x):
          return x * 2


      def format_total(values, separator):
          total = sum(values)
          return (
              separator.join([str(value) for value in values])
              + " = "
              + str(total)
          )
