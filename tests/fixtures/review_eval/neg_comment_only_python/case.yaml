description: Adds and rewords `#` comments inside two tested/untested functions; behaviour is identical.
negative: true
commit_change: true
base:
  from: py_pkg
change:
  files:
    pkg/util.py: |
      def helper(x):
          """Add one to x."""
          # The increment is fixed by the spec.
          return x + 1


      def legacy(x):
          # Kept for old callers.
          return x * 2


      def format_total(values, separator):
          total = sum(values)
          return separator.join([str(value) for value in values]) + " = " + str(total)
