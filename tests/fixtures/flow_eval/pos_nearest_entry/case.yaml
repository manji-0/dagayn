description: main dispatches to a handle_ function; a handle_ name that production code calls is a step, so the entry point is main.
target: srv/work.py::process
files:
  srv/__init__.py: ""
  srv/main.py: |
    from srv.handlers import handle_request


    def main():
        handle_request({})
  srv/handlers.py: |
    from srv.work import process


    def handle_request(payload):
        return process(payload)
  srv/work.py: |
    def process(payload):
        return payload
expected_entry_points:
- entry_point: srv/main.py::main
  kind: main
  chain: [srv/main.py::main, srv/handlers.py::handle_request, srv/work.py::process]
