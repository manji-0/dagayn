description: A helper used from six modules has no test of its own, but the tests of its callers reach
  it.
negative: true
files:
  pkg/__init__.py: ''
  pkg/util.py: |
    def helper(value):
        return value * 2
  pkg/user0.py: |
    from pkg.util import helper


    def run0():
        return helper(0)
  pkg/user1.py: |
    from pkg.util import helper


    def run1():
        return helper(1)
  pkg/user2.py: |
    from pkg.util import helper


    def run2():
        return helper(2)
  pkg/user3.py: |
    from pkg.util import helper


    def run3():
        return helper(3)
  pkg/user4.py: |
    from pkg.util import helper


    def run4():
        return helper(4)
  pkg/user5.py: |
    from pkg.util import helper


    def run5():
        return helper(5)
  tests/test_users.py: |
    from pkg.user0 import run0
    from pkg.user1 import run1


    def test_run0():
        assert run0() == 0


    def test_run1():
        assert run1() == 2
