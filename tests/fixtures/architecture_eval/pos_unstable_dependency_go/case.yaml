description: Package kernel, which feature and app depend on, imports plugins, which imports two
  packages. The Go counterpart of pos_unstable_dependency_rust.
expected_units:
  example.com/layers/kernel: go_package
  example.com/layers/plugins: go_package
files:
  go.mod: |
    module example.com/layers

    go 1.22
  kernel/kernel.go: |
    package kernel

    import "example.com/layers/plugins"

    // Base is the value every other package builds on.
    func Base() int {
    	return 1 + plugins.Plugin()
    }
  feature/feature.go: |
    package feature

    import "example.com/layers/kernel"

    func Feature() int {
    	return kernel.Base() + 1
    }
  app/app.go: |
    package app

    import (
    	"example.com/layers/extras"
    	"example.com/layers/feature"
    	"example.com/layers/kernel"
    )

    func Run() int {
    	return feature.Feature() + kernel.Base() + extras.Extra()
    }
  plugins/plugins.go: |
    package plugins

    import (
    	"example.com/layers/extras"
    	"example.com/layers/thirdparty"
    )

    func Plugin() int {
    	return extras.Extra() + thirdparty.Vendored()
    }
  extras/extras.go: |
    package extras

    func Extra() int {
    	return 2
    }
  thirdparty/thirdparty.go: |
    package thirdparty

    func Vendored() int {
    	return 3
    }
expected_findings:
- kind: unstable_dependency
  target: kernel/kernel.go
  also:
  - example.com/layers/kernel
  - example.com/layers/plugins
