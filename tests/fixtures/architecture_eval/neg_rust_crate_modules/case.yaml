description: Modules of one Rust crate refer to each other; the crate is the compilation unit, so this
  is no cycle to report.
negative: true
expected_units:
  demo: cargo_crate
files:
  Cargo.toml: |
    [package]
    name = "demo"
    version = "0.1.0"
    edition = "2021"
  src/lib.rs: |
    mod a;
    mod b;

    pub use a::run;
  src/a.rs: |
    use crate::b::helper;

    pub fn run() -> u32 {
        helper() + 1
    }

    pub fn base() -> u32 {
        1
    }
  src/b.rs: |
    use crate::a::base;

    pub fn helper() -> u32 {
        base() * 2
    }
