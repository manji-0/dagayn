description: Unexported Go functions whose doc comments, as Go style asks, start with their names. Nothing calls them, so they are unused; a definition's own doc comment, a `//` run or a `/* */` block, is not a use of its name (#244).
files:
  go.mod: |
    module example.com/dict

    go 1.22
  builder.go: |
    package dict

    // Build returns the dictionary for samples.
    func Build(samples [][]byte) []byte {
    	return pack(samples)
    }

    // hash3 returns the hash of the lower 3 bytes of u.
    // hash3 is not used by Build.
    func hash3(u uint32) uint32 {
    	return (u << 8) * 506832829 >> 16
    }

    // pack joins the samples.
    func pack(samples [][]byte) []byte {
    	var out []byte
    	for _, s := range samples {
    		out = append(out, s...)
    	}
    	return out
    }

    /*
    unpackStale splits what pack joined.
    unpackStale is not used.
    */
    func unpackStale(b []byte) [][]byte {
    	return [][]byte{b}
    }
expected_findings:
- kind: unused_symbol
  target: builder.go::hash3
- kind: unused_symbol
  target: builder.go::unpackStale
