description: A module-level Python function `dedent` that nothing imports or calls. The entry imports `dedent` from the standard library's `textwrap` and calls it. That binding is not the application's `dedent`, so the local one is unused (#257).
files:
  app/__init__.py: ""
  app/text.py: |
    def dedent(text):
        return "\n".join(line.strip() for line in text.splitlines())


    def shout(text):
        return text.upper()
  app/main.py: |
    from textwrap import dedent

    from app.text import shout

    print(shout(dedent("  hello")))
expected_findings:
- kind: unused_symbol
  target: app/text.py::dedent
