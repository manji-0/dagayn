description: corelib's parse_line is what the app package uses most from it, and it has no docstring.
files:
  corelib/__init__.py: ''
  corelib/parse.py: |
    def parse_line(line):
        return line.split(',')
  app/__init__.py: ''
  app/read.py: |
    from corelib.parse import parse_line


    def read_one(line):
        return parse_line(line)
  app/count.py: |
    from corelib.parse import parse_line


    def count_fields(line):
        return len(parse_line(line))
  app/main.py: |
    from app.count import count_fields
    from app.read import read_one


    def main():
        return read_one('a,b'), count_fields('a')
