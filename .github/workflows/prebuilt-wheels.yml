name: Prebuilt Wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            python-version: "3.12"
          - os: ubuntu-latest
            platform: linux-amd64
            python-version: "3.13"
          - os: ubuntu-latest
            platform: linux-amd64
            python-version: "3.14"
          - os: macos-14
            platform: macos-arm64
            python-version: "3.12"
          - os: macos-14
            platform: macos-arm64
            python-version: "3.13"
          - os: macos-14
            platform: macos-arm64
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }} py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Rust
        # The macOS-14 runner image ships a stale ``$HOME/.cargo/bin/cargo``
        # that is actually a rustup-init binary (verified by running
        # ``cargo --version`` and seeing ``rustup-init 1.29.0``).
        # ``dtolnay/rust-toolchain@stable`` doesn't rebuild that shim
        # reliably, so we wipe ~/.cargo and reinstall via the upstream
        # installer.  This makes ``cargo metadata`` (which maturin invokes
        # during the build) resolve to a real cargo, not to rustup-init.
        shell: bash
        run: |
          rm -rf "${HOME}/.cargo" "${HOME}/.rustup"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify Rust toolchain
        shell: bash
        run: |
          export PATH="${HOME}/.cargo/bin:$PATH"
          cargo --version
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build wheel
        # ``uvx`` builds a temporary venv whose bin is prepended to PATH,
        # so force ``$HOME/.cargo/bin`` back to the front before invoking it.
        shell: bash
        run: |
          export PATH="${HOME}/.cargo/bin:$PATH"
          uvx maturin build --release --out dist -i python

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Upload wheel to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release upload "$TAG_NAME" dist/*.whl --clobber
