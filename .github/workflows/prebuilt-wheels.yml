name: Prebuilt Wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            python-version: "3.12"
          - os: ubuntu-latest
            platform: linux-amd64
            python-version: "3.13"
          - os: ubuntu-latest
            platform: linux-amd64
            python-version: "3.14"
          - os: macos-14
            platform: macos-arm64
            python-version: "3.12"
          - os: macos-14
            platform: macos-arm64
            python-version: "3.13"
          - os: macos-14
            platform: macos-arm64
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }} py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Rust
        # The macOS-14 runner image ships a stale ``$HOME/.cargo/bin/cargo``
        # that is actually a rustup-init binary (verified by running
        # ``cargo --version`` and seeing ``rustup-init 1.29.0``).
        # ``dtolnay/rust-toolchain@stable`` doesn't rebuild that shim
        # reliably, so we wipe ~/.cargo and reinstall via the upstream
        # installer.  This makes ``cargo metadata`` (which maturin invokes
        # during the build) resolve to a real cargo, not to rustup-init.
        shell: bash
        run: |
          rm -rf "${HOME}/.cargo" "${HOME}/.rustup"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify Rust toolchain
        shell: bash
        run: |
          export PATH="${HOME}/.cargo/bin:$PATH"
          cargo --version
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build wheel
        # ``uvx`` builds a temporary venv whose bin is prepended to PATH,
        # so force ``$HOME/.cargo/bin`` back to the front before invoking it.
        shell: bash
        run: |
          export PATH="${HOME}/.cargo/bin:$PATH"
          uvx maturin build --release --out dist -i python

      - name: Smoke-test the installed dagayn command
        # The console script runs build/update/status in the Rust CLI inside
        # ``_core`` and everything else in Python; check both from a fresh
        # install of the wheel, and that the two agree on ``status``. ``-P``
        # keeps the checkout's source ``dagayn`` (no ``_core``) off sys.path.
        shell: bash
        run: |
          venv="${RUNNER_TEMP}/wheel-smoke"
          uv venv "$venv" --python "${{ matrix.python-version }}"
          uv pip install --python "$venv/bin/python" dist/*.whl
          repo="$(mktemp -d)"
          cp -R tests/fixtures/parity/python_only/. "$repo"
          rm -rf "$repo/.dagayn"
          git -C "$repo" init -q
          "$venv/bin/dagayn" --version
          "$venv/bin/dagayn" build --repo "$repo"
          "$venv/bin/python" -P -c "import sys; from dagayn import _core; sys.exit(_core.run_cli(['dagayn', 'status', '--repo', sys.argv[1]]))" "$repo" > rust.txt
          DAGAYN_PYTHON_CLI=1 "$venv/bin/dagayn" status --repo "$repo" > python.txt
          diff python.txt rust.txt
          # `dagayn serve` lists the tools from the packaged surface file and
          # relays a call to the Python server.
          "$venv/bin/python" -P - "$venv/bin/dagayn" "$repo" <<'PY'
          import json, subprocess, sys
          server = subprocess.Popen([sys.argv[1], "serve", "--repo", sys.argv[2]], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          def ask(i, method, params):
              server.stdin.write(json.dumps({"jsonrpc": "2.0", "id": i, "method": method, "params": params}) + "\n")
              server.stdin.flush()
              return json.loads(server.stdout.readline())
          ask(0, "initialize", {"protocolVersion": "2025-06-18", "capabilities": {}, "clientInfo": {"name": "smoke", "version": "0"}})
          server.stdin.write('{"jsonrpc":"2.0","method":"notifications/initialized"}\n')
          assert len(ask(1, "tools/list", {})["result"]["tools"]) == 9
          reply = ask(2, "tools/call", {"name": "query_graph_tool", "arguments": {"pattern": "file_summary", "target": "main.py"}})
          assert reply["result"]["isError"] is False, reply
          server.stdin.close()
          assert server.wait(timeout=30) == 0
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Upload wheel to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release upload "$TAG_NAME" dist/*.whl --clobber
