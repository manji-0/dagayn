name: Prebuilt Wheels

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            python-version: "3.12"
          - os: ubuntu-latest
            platform: linux-amd64
            python-version: "3.13"
          - os: ubuntu-latest
            platform: linux-amd64
            python-version: "3.14"
          - os: macos-14
            platform: macos-arm64
            python-version: "3.12"
          - os: macos-14
            platform: macos-arm64
            python-version: "3.13"
          - os: macos-14
            platform: macos-arm64
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }} py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build wheel
        run: uvx maturin build --release --out dist -i python

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14
