name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies (frozen)
        run: uv sync --frozen --extra dev
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Check formatting with ruff
        run: uv run ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies (frozen)
        run: uv sync --frozen --extra dev
      - name: Run ty
        run: >
          uv tool run ty check dagayn tests
          --python-version 3.13
          --ignore unresolved-import
          --output-format github
          --no-progress

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Run bandit security scan
        run: uv tool run --with 'bandit[toml]' bandit -r dagayn/ -c pyproject.toml

  schema-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Python/VSCode schema versions match
        run: |
          PY_VER=$(grep -oP 'LATEST_VERSION\s*=\s*max\(MIGRATIONS\.keys\(\)\)' dagayn/migrations.py > /dev/null && python3 -c "
          import re, ast
          src = open('dagayn/migrations.py').read()
          m = re.search(r'MIGRATIONS:\s*dict\[.*?\]\s*=\s*\{([^}]+)\}', src)
          keys = [int(k.strip().rstrip(':')) for k in re.findall(r'(\d+):', m.group(1))]
          print(max(keys))
          ")
          TS_VER=$(grep -oP 'SUPPORTED_SCHEMA_VERSION\s*=\s*\K\d+' dagayn-vscode/src/backend/sqlite.ts)
          echo "Python LATEST_VERSION: $PY_VER"
          echo "VSCode SUPPORTED_SCHEMA_VERSION: $TS_VER"
          if [ "$PY_VER" != "$TS_VER" ]; then
            echo "::error::Schema version mismatch! Python=$PY_VER, VSCode=$TS_VER"
            exit 1
          fi
          echo "Schema versions in sync."

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies (frozen)
        run: uv sync --frozen --extra dev
      - name: Prefetch pinned grammars
        run: uv run python -m dagayn.vendor_grammars
      - name: Run tests with coverage
        run: uv run pytest --tb=short -q --cov=dagayn --cov-report=term-missing --cov-fail-under=65

  rust-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Install dependencies (frozen)
        run: uv sync --frozen --extra dev
      - name: Build editable package with Rust backend
        run: uvx maturin develop --release
      - name: Check Rust workspace
        run: |
          cargo test --workspace
          cargo clippy --workspace -- -D warnings
      - name: Run Rust backend parity tests
        env:
          DAGAYN_BACKEND: rust
        run: uv run pytest tests/test_rust_backend_parity.py -q
      - name: Smoke-test uvx source install path
        run: uvx --refresh --from . dagayn --help

  install-smoke:
    runs-on: macos-latest
    strategy:
      matrix:
        install-command:
          - 'python -m pip install .'
          - 'uv tool install --refresh --force --from . dagayn'
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Rust
        # See prebuilt-wheels.yml for why we bypass dtolnay/rust-toolchain on
        # macOS: the runner image's stale ~/.cargo/bin/cargo is actually
        # rustup-init, and the action does not reliably overwrite it.
        shell: bash
        run: |
          rm -rf "${HOME}/.cargo" "${HOME}/.rustup"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
      - name: Verify Rust toolchain
        shell: bash
        run: |
          export PATH="${HOME}/.cargo/bin:$PATH"
          cargo --version
          rustc --version
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Create install-smoke virtual environment
        shell: bash
        run: |
          uv venv
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
          uv pip install pip
      - name: Run install smoke test
        shell: bash
        run: |
          export PATH="${HOME}/.cargo/bin:$PATH"
          ${{ matrix.install-command }}
      - name: Verify CLI
        run: dagayn --help
