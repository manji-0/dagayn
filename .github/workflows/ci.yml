name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies (frozen)
        run: uv sync --frozen --extra dev
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Check formatting with ruff
        run: uv run ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies (frozen)
        run: uv sync --frozen --extra dev
      - name: Run pyrefly
        run: >
          uv run pyrefly check
          --output-format github
          --progress-bar=no

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Run bandit security scan
        run: uv tool run --with 'bandit[toml]' bandit -r dagayn/ -c pyproject.toml

  schema-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check graph store/VSCode schema versions match
        run: |
          PY_VER=$(grep -oP 'const LATEST_VERSION: i64 = \K\d+' crates/dagayn-graph/src/lib.rs)
          TS_VER=$(grep -oP 'SUPPORTED_SCHEMA_VERSION\s*=\s*\K\d+' dagayn-vscode/src/backend/sqlite.ts)
          echo "Graph store LATEST_VERSION: $PY_VER"
          echo "VSCode SUPPORTED_SCHEMA_VERSION: $TS_VER"
          if [ "$PY_VER" != "$TS_VER" ]; then
            echo "::error::Schema version mismatch! graph store=$PY_VER, VSCode=$TS_VER"
            exit 1
          fi
          echo "Schema versions in sync."

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Install dependencies (frozen)
        # Builds the editable extension with the `dev-fast` profile
        # (`[tool.uv]` in pyproject.toml), not the fat-LTO release profile.
        run: uv sync --frozen --extra dev
      - name: Prefetch pinned grammars
        run: uv run python -m dagayn.vendor_grammars
      - name: Run tests with coverage
        run: uv run pytest --tb=short -q -n auto --dist loadfile --cov --cov-report=term-missing --cov-fail-under=80

  rust-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add llvm-tools to the pinned toolchain
        run: rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Install dependencies (frozen)
        # Also builds and installs the editable Rust extension.
        run: uv sync --frozen --extra dev
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy and tests on grammar subsets
        # Each grammar is a `lang-*` feature (docs/GRAMMAR-PROVISIONING.md).
        # No grammar, a pair, and bash (which reads JavaScript's headers) must
        # each build cleanly; these recompile only dagayn-parser and a few
        # grammars.
        run: |
          cargo clippy -p dagayn-parser --no-default-features --all-targets -- -D warnings
          cargo clippy -p dagayn-parser --no-default-features --features lang-bash -- -D warnings
          cargo clippy -p dagayn-parser --no-default-features --features lang-python,lang-rust --all-targets -- -D warnings
          cargo test -p dagayn-parser --no-default-features --features lang-python,lang-rust
      - name: Rust tests with coverage
        # dagayn-py is the PyO3 layer, exercised by the Python test job.
        run: >
          cargo llvm-cov --workspace --summary-only
          --ignore-filename-regex 'dagayn-py/' --fail-under-lines 82
      - name: Standalone Rust CLI against the Python one
        # The Rust `dagayn build` and `update` must write the graph the Python
        # CLI writes; the server under test stays the Python one.
        run: |
          cargo build --profile dev-fast -p dagayn-cli
          DAGAYN_CLI_CMD="$PWD/target/dev-fast/dagayn" uv run pytest -q tests/test_mcp_snapshots.py
          DAGAYN_RUST_CLI="$PWD/target/dev-fast/dagayn" uv run pytest -q -n auto tests/test_update_parity.py
      - name: Rust MCP front end against the fastmcp server
        # The installed `dagayn serve` answers the handshake and listings in
        # Rust and relays the rest; the snapshots were taken from fastmcp.
        run: |
          DAGAYN_MCP_SERVER_CMD="$PWD/.venv/bin/dagayn serve" uv run pytest -q -n auto tests/test_mcp_snapshots.py
      - name: Smoke-test uvx source install path
        run: uvx --refresh --from . dagayn --help

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dagayn-vscode
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: dagayn-vscode/pnpm-lock.yaml
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: Compile
        run: pnpm compile
      - name: Check formatting
        run: pnpm fmt:check
      - name: Lint (tsc --noEmit)
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Type-check tests
        run: pnpm test:compile
      - name: Package VSIX
        run: pnpm package

  install-smoke:
    runs-on: macos-latest
    strategy:
      matrix:
        install-command:
          - 'python -m pip install .'
          - 'uv tool install --refresh --force --from . dagayn'
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Rust
        # See prebuilt-wheels.yml for why we bypass dtolnay/rust-toolchain on
        # macOS: the runner image's stale ~/.cargo/bin/cargo is actually
        # rustup-init, and the action does not reliably overwrite it.
        shell: bash
        run: |
          rm -rf "${HOME}/.cargo" "${HOME}/.rustup"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
      - name: Verify Rust toolchain
        shell: bash
        run: |
          export PATH="${HOME}/.cargo/bin:$PATH"
          cargo --version
          rustc --version
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Create install-smoke virtual environment
        shell: bash
        run: |
          uv venv
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
          uv pip install pip
      - name: Run install smoke test
        shell: bash
        run: |
          export PATH="${HOME}/.cargo/bin:$PATH"
          ${{ matrix.install-command }}
      - name: Verify CLI
        run: dagayn --help
