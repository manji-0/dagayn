name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies (frozen)
        run: uv sync --frozen --extra dev
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Check formatting with ruff
        run: uv run ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies (frozen)
        run: uv sync --frozen --extra dev
      - name: Run ty
        run: >
          uv tool run ty check dagayn
          --python-version 3.13
          --ignore unresolved-import
          --output-format github
          --no-progress

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Run bandit security scan
        run: uv tool run --with 'bandit[toml]' bandit -r dagayn/ -c pyproject.toml

  schema-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python/VSCode schema versions match
        run: |
          PY_VER=$(grep -oP 'LATEST_VERSION\s*=\s*max\(MIGRATIONS\.keys\(\)\)' dagayn/migrations.py > /dev/null && python3 -c "
          import re, ast
          src = open('dagayn/migrations.py').read()
          m = re.search(r'MIGRATIONS:\s*dict\[.*?\]\s*=\s*\{([^}]+)\}', src)
          keys = [int(k.strip().rstrip(':')) for k in re.findall(r'(\d+):', m.group(1))]
          print(max(keys))
          ")
          TS_VER=$(grep -oP 'SUPPORTED_SCHEMA_VERSION\s*=\s*\K\d+' dagayn-vscode/src/backend/sqlite.ts)
          echo "Python LATEST_VERSION: $PY_VER"
          echo "VSCode SUPPORTED_SCHEMA_VERSION: $TS_VER"
          if [ "$PY_VER" != "$TS_VER" ]; then
            echo "::error::Schema version mismatch! Python=$PY_VER, VSCode=$TS_VER"
            exit 1
          fi
          echo "Schema versions in sync."

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies (frozen)
        run: uv sync --frozen --extra dev
      - name: Prefetch pinned grammars
        run: uv run python -m dagayn.vendor_grammars
      - name: Run tests with coverage
        run: uv run pytest --tb=short -q --cov=dagayn --cov-report=term-missing --cov-fail-under=65
