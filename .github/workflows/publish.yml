name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            python-version: "3.12"
            args: --release --sdist --out dist -i python
          - os: ubuntu-latest
            platform: linux-amd64
            python-version: "3.13"
            args: --release --out dist -i python
          - os: ubuntu-latest
            platform: linux-amd64
            python-version: "3.14"
            args: --release --out dist -i python
          - os: macos-14
            platform: macos-arm64
            python-version: "3.12"
            args: --release --out dist -i python
          - os: macos-14
            platform: macos-arm64
            python-version: "3.13"
            args: --release --out dist -i python
          - os: macos-14
            platform: macos-arm64
            python-version: "3.14"
            args: --release --out dist -i python
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }} py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Rust
        # Keep this aligned with prebuilt-wheels.yml: the macOS-14 runner can
        # ship a stale cargo shim that dtolnay/rust-toolchain does not replace.
        shell: bash
        run: |
          rm -rf "${HOME}/.cargo" "${HOME}/.rustup"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify Rust toolchain
        shell: bash
        run: |
          export PATH="${HOME}/.cargo/bin:$PATH"
          cargo --version
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build source distribution and wheel
        shell: bash
        run: |
          export PATH="${HOME}/.cargo/bin:$PATH"
          uvx maturin build ${{ matrix.args }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}-py${{ matrix.python-version }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: uvx twine upload dist/*
