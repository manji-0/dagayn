[package]
name = "dagayn-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
dagayn-graph = { path = "../dagayn-graph" }
dagayn-parser = { path = "../dagayn-parser" }
dagayn-postproc = { path = "../dagayn-postproc" }
pyo3.workspace = true
rayon = "1.10"
serde_json.workspace = true
sha2.workspace = true

[package.metadata.maturin]
name = "dagayn._core"
