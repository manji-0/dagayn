[package]
name = "dagayn-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
dagayn-build = { path = "../dagayn-build" }
dagayn-cli = { path = "../dagayn-cli" }
dagayn-graph = { path = "../dagayn-graph" }
dagayn-mcp = { path = "../dagayn-mcp" }
dagayn-parser = { path = "../dagayn-parser" }
dagayn-postproc = { path = "../dagayn-postproc" }
dagayn-tools = { path = "../dagayn-tools" }
pyo3.workspace = true
serde_json.workspace = true

[package.metadata.maturin]
name = "dagayn._core"
