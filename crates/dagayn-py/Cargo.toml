[package]
name = "dagayn-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["fts-wakati"]
extension-module = ["pyo3/extension-module"]
fts-wakati = ["dagayn-core/fts-wakati"]

[dependencies]
dagayn-core = { path = "../dagayn-core", default-features = false, features = ["fts-wakati"] }
pyo3.workspace = true
serde_json.workspace = true
sha2.workspace = true

[package.metadata.maturin]
name = "dagayn._core"
