[package]
name = "dagayn-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "dagayn"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dagayn-build = { path = "../dagayn-build" }
dagayn-graph = { path = "../dagayn-graph" }
serde_json.workspace = true

[dev-dependencies]
libc = "0.2"
