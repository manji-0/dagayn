[package]
name = "dagayn-graph"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# All grammars by default; a subset is chosen on the crate that
# forwards dagayn-parser's `lang-*` features (dagayn-py, dagayn-cli,
# dagayn-build).
[features]
default = ["all-languages"]
all-languages = [
    "dagayn-parser/all-languages",
]

[dependencies]
lindera = { version = "6", default-features = false, features = ["embed-ipadic"] }
rayon = "1.10"
rusqlite.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
scip = "0.10"
protobuf = "3.7"

[dev-dependencies]
dagayn-parser = { path = "../dagayn-parser", default-features = false }

