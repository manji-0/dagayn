[package]
name = "dagayn-graph"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["fts-wakati"]
fts-wakati = ["dep:lindera", "dep:lindera-analysis"]

[dependencies]
lindera = { version = "5.3", features = ["embed-ipadic"], optional = true }
lindera-analysis = { version = "5.3", optional = true }
rayon = "1.10"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
