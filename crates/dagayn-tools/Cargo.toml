[package]
name = "dagayn-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# All grammars by default; a subset is chosen on the crate that
# forwards dagayn-parser's `lang-*` features (dagayn-py, dagayn-cli,
# dagayn-build).
[features]
default = ["all-languages"]
all-languages = [
    "dagayn-build/all-languages",
    "dagayn-graph/all-languages",
    "dagayn-parser/all-languages",
]

[dependencies]
dagayn-build = { path = "../dagayn-build", default-features = false }
dagayn-graph = { path = "../dagayn-graph", default-features = false }
dagayn-parser = { path = "../dagayn-parser", default-features = false }
regex.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
rusqlite.workspace = true
