[workspace]
members = [
    "crates/dagayn-core",
    "crates/dagayn-grammars",
    "crates/dagayn-graph",
    "crates/dagayn-parser",
    "crates/dagayn-postproc",
    "crates/dagayn-py",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/tirth8205/code-review-graph"

[workspace.dependencies]
anyhow = "1"
globset = "0.4"
pyo3 = "0.28"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
