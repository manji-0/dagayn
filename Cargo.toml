[workspace]
members = [
    "crates/dagayn-core",
    "crates/dagayn-grammars",
    "crates/dagayn-graph",
    "crates/dagayn-parser",
    "crates/dagayn-postproc",
    "crates/dagayn-py",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/tirth8205/code-review-graph"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace.dependencies]
globset = "0.4"
memchr = "2"
pyo3 = "0.28"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
tree-sitter = "0.26"
tree-sitter-language = "0.1"
