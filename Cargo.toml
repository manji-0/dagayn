[workspace]
members = [
    "crates/dagayn-build",
    "crates/dagayn-cli",
    "crates/dagayn-grammars",
    "crates/dagayn-graph",
    "crates/dagayn-mcp",
    "crates/dagayn-parser",
    "crates/dagayn-postproc",
    "crates/dagayn-py",
    "crates/dagayn-tools",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/tirth8205/code-review-graph"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Editable installs (`uv sync`, see `[tool.uv]` in pyproject.toml): optimized
# so pytest's real parsing stays fast, without the fat-LTO single-unit link
# that makes every rebuild take minutes. Release wheels keep `release`.
[profile.dev-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false

[workspace.dependencies]
globset = "0.4"
memchr = "2"
pyo3 = "0.28"
regex = "1"
# Ruff's parser crates are internal components of Ruff with no API
# stability promise: every 0.0.x release may break, so pin exactly.
ruff_python_ast = "=0.0.16"
# The collection type of ruff_python_ast bodies; tracks its version.
thin-vec = "0.2.20"
ruff_python_parser = "=0.0.16"
ruff_text_size = "=0.0.16"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
tree-sitter = "0.27"
tree-sitter-language = "0.1.8"
