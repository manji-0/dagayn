# Ground truth for eval/run_terraform_eval.py: every literal reference from
# Terraform to code in four public repositories, at a pinned commit.
#
# Inclusion rule. A string literal, optionally prefixed with ${path.module} or
# ${path.root}, that names application code, a code package (directory or
# zip), a script, or a handler / entry point, in a resource, data or module
# block. Expressions built from var./local./other interpolation are out (the
# payment repository reaches its six function directories only through
# ${var.lambda_name}). Data files (SQL dumps, schema templates, config.yaml)
# are out. Local module sources are listed as module_source; registry sources
# are out.
#
# Each entry: family, at (file:line of the literal, for the reader; the
# harness matches on source and target, not on line), source (the dagayn
# qualified name of the Terraform block), attr, value, target (repository
# path, file::symbol, or a list when the value names several candidates),
# exists (target is in the tree at sha: false for build outputs, code inside
# a zip, and paths into the opentelemetry-lambda submodule, which a plain
# clone does not check out).
#
# Families. path_attr (filename / source_dir / source_file /
# source_directory), local_exec (a path in a local-exec command) and
# entrypoint (handler / entry_point) in resource and data blocks are what
# crates/dagayn-parser/src/terraform_bridges.rs extracts. module_input
# (handler, entry_point, source_path, local_existing_package passed to a
# module), object_source (source of aws_s3_object /
# google_storage_bucket_object), external_program (data "external" program)
# and file_call (file() / filesha256()) are real references it does not
# cover.
#
# Drafted by a scratch scan of the .tf files (string literals in watched
# attributes, paths normalized against the file's directory, `exists` from
# the checkout). By hand: every entry read in this file, every handler and
# entry-point target and its `exists` decided by reading the module's
# source_path and the handler code, the local_exec, file_call and
# local_existing_package entries written from the source, and non-code
# values (build commands, patterns, config and SQL files) dropped. The
# mechanical module_source and source_path entries were spot-checked against
# the source, not each one.
#
# review_judgments: hand verdicts ({commit, qualified_name, correct, why}) on
# the bridge_touched findings that `--review 10` produced. The 2026-10-25 run
# produced none.
