# repo names a key of run_search_eval.py --repo NAME=PATH (default: dagayn).
# intent: exact-symbol | keyword | prose-intent | japanese
queries:
  - id: exact-rrf-merge
    query: rrf_merge
    intent: exact-symbol
  - id: prose-rrf
    query: reciprocal rank fusion merge ranked lists
    intent: prose-intent
  - id: docs-markdown-evidence
    query: markdown code spans should not become documentation obligations
    intent: prose-intent
  - id: exact-hybrid-search
    query: hybrid_search
    intent: exact-symbol
  - id: exact-seed-worktree
    query: seed_worktree_graph
    intent: exact-symbol
  - id: kw-registry-register
    query: registry register repository
    intent: keyword
  - id: kw-import-cycles
    query: import cycles
    intent: keyword
  - id: prose-japanese-tokens
    query: split Japanese text into tokens for the full text index
    intent: prose-intent
  - id: prose-dead-code
    query: find functions and classes that nothing refers to
    intent: prose-intent
  - id: prose-embedding-sidecar
    query: start the llama.cpp embedding server and wait until it is ready
    intent: prose-intent
  - id: prose-daemon
    query: background process that keeps several repositories' graphs up to date
    intent: prose-intent
  - id: ja-japanese-tokens
    query: 日本語のテキストを全文検索用に分割する
