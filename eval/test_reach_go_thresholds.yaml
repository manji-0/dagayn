# Gate for untested_change's judgement of Go functions against the coverage
# of `go test -coverpkg` (docs/plans/GO-SUPPORT-MEASUREMENTS.md#m2-test-reach-against-go-coverage),
# on a plain `dagayn build` of testify v1.12.1's assert, require, internal,
# and mock packages (eval/go_test_reach_corpus.sh). Measured 2026-11-08 at go
# extractor 19 on 796 functions: untested precision 0.965, recall 0.993,
# tested precision 0.991. The floors sit about 0.03 under, as Rust's do.
floors:
  untested_precision: 0.93
  untested_recall: 0.96
  tested_precision: 0.96
