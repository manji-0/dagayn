# at the same commits): purecrate-ts's examples and purecrate, and dagayn-postproc, left the
# extremes; dagayn, purecrate-check, and purecrate-pack entered.
# actionable: the value points at a change a careful engineer would make;
# false: the value is wrong (an edge or a count the graph got wrong);
# noise: the value is right but points at nothing to change.
# refused_member has no candidate in any repository, so it has no row.
