# purecrate-ts 2e2a4c5f, tstodon 4694e9c3, all full builds (schema 20, rust 23,
# javascript 12). SAP rows were rerun after bare names stopped matching across
# language families and external imports (fix/bare-names-stay-in-language; dagayn
