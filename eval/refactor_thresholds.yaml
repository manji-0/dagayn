# Ship gate for refactor_tool(mode="suggest") finding kinds
# (docs/plans/REFACTOR-TOOL-TARGET.md#evaluation).
# `run_refactor_eval.py --gate` exits non-zero when a gated kind has a
# precision or recall below its floor or a case errors.
defaults:
  gated: true
  precision_floor: 0.8
  recall_floor: 0.8
kinds:
  unused_symbol: {}
  complex_hotspot: {}
  undocumented_surface: {}
