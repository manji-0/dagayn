# Gate for untested_change's judgement of Rust functions against the
# coverage of `cargo llvm-cov` (docs/plans/TEST-REACH-TARGET.md#rust), on a
# plain `dagayn build` (no SCIP overlay). Measured 2026-10-25 on 2,972
# functions, with trait methods reached through their type: untested
# precision 0.464, recall 0.267, tested precision 0.944. llvm-cov counts
# what binaries the tests spawn ran, which the call graph does not cross, so
# the floors sit a little further under the current values than Python's.
floors:
  untested_precision: 0.43
  untested_recall: 0.23
  tested_precision: 0.92
