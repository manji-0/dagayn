# Hand judgments for run_review_modes_measure.py. One row per candidate fact
# (a node impact or context names beyond changes that has a direct graph edge
# into a symbol the diff touched). id = <repo>@<sha8>:<qualified_name>.
# actionable: a reviewer would act on it (a caller to edit or to check because
# the change makes its argument decisive, a test to run, a doc to update).
# noise: the caller passes the same inputs and its behavior is untouched, or
# the change preserves behavior. Every candidate in all 44 commits is judged.
