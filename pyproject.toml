[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "dagayn"
version = "4.10.1"
description = "Fork of code-review-graph with first-class Terraform support powered by treesitter-tf"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Wataru Manji" },
]
keywords = ["code-review", "knowledge-graph", "tree-sitter", "claude-code", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.0.0,<2",
    # fastmcp 2.14+ fixes CVE-2025-62800/62801/66416 and drops the
    # transitive fakeredis dep that was broken by a rename upstream.
    # See: #139, #195
    "fastmcp>=3.2.4",
    "pydantic>=2.10,<3",
    "networkx>=3.2,<4",
    "watchdog>=4.0.0,<6",
    "igraph>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/manji-0/dagayn"
Repository = "https://github.com/manji-0/dagayn"
Issues = "https://github.com/manji-0/dagayn/issues"
Changelog = "https://github.com/manji-0/dagayn/blob/main/CHANGELOG.md"
PyPI = "https://pypi.org/project/dagayn/"
Upstream = "https://github.com/tirth8205/code-review-graph"

[project.scripts]
dagayn = "dagayn.cli:main"
dagayn-daemon = "dagayn.daemon_cli:main"

[project.optional-dependencies]
numpy = [
    "numpy>=1.26,<3",
]
google-embeddings = [
    "google-generativeai>=0.8.0,<1",
]
communities = [
    "igraph>=0.11.0",
]
eval = [
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
]
wiki = [
    "ollama>=0.1.0",
]
all = [
    "dagayn[communities]",
    "dagayn[enrichment]",
    "dagayn[eval]",
    "dagayn[numpy]",
    "dagayn[wiki]",
]
enrichment = [
    "jedi>=0.19.2",
]
dev = [
    "numpy>=1.26,<3",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=4.0,<8",
    "ruff>=0.3.0,<1",
    "pyinstrument>=4.6,<6",
]

[tool.maturin]
manifest-path = "crates/dagayn-py/Cargo.toml"
module-name = "dagayn._core"
python-source = "."
features = ["extension-module"]
include = [
    { path = "README.md", format = "sdist" },
    { path = "LICENSE", format = "sdist" },
    { path = "NOTICE", format = "sdist" },
    { path = "pyproject.toml", format = "sdist" },
    { path = "Cargo.toml", format = "sdist" },
    { path = "skills/**/*", format = "wheel" },
    { path = "skills/**/*", format = "sdist" },
    { path = "docs/**/*", format = "wheel" },
    { path = "docs/**/*", format = "sdist" },
    { path = "dagayn/_vendor_grammars/**/*", format = "wheel" },
    { path = "dagayn/_vendor_grammars/**/*", format = "sdist" },
    { path = ".claude-plugin/**/*", format = "sdist" },
    { path = "hooks/**/*", format = "sdist" },
    { path = "rust-toolchain.toml", format = "sdist" },
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "diagrams/",  # diagram DSL scripts — intentionally compact, non-standard style
    "tests/fixtures/sample_databricks_notebook.ipynb",  # SQL/R/Scala cells are not valid Python
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/sample_databricks_export.py" = ["F841", "W292"]  # intentional fixture patterns
"tests/fixtures/sample_notebook.ipynb" = ["F401", "I001"]  # fixture imports: intentionally unused, split across cells
"tests/test_multilang.py" = ["E501"]  # long assertions with explanatory comments

[tool.bandit]
# B101: assert used (fine in non-security code)
# B404: import subprocess (we need git interaction)
# B603: subprocess without shell=True (we use list args, not shell)
# B607: partial executable path (calling "git" by name is standard)
# B608: SQL f-string — false positive, we use parameterized "?" placeholders on a local SQLite DB
skips = ["B101", "B404", "B603", "B607", "B608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.pyrefly]
python-version = "3.13"
project-includes = ["dagayn", "tests"]
project-excludes = ["tests/fixtures/**"]

[tool.pyrefly.errors]
# dagayn._core is a compiled Rust extension and optional extras are not always
# installed in type-checking environments; pyrefly >= 0.33.0 applies Pydantic
# model semantics (BaseModel/Field/ConfigDict/BaseSettings) automatically.
missing-import = false

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pyrefly>=0.33.0",
    "types-networkx>=3.6,<4",
    "types-PyYAML>=6.0.12,<7",
]
