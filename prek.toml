minimum_prek_version = "0.3.8"
default_install_hook_types = ["pre-commit", "pre-push"]
fail_fast = true
exclude = { glob = [".serena/**", ".beads/**"] }

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
exclude = { glob = "CHANGELOG.md" }

[[repos.hooks]]
id = "mixed-line-ending"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "dagayn-vscode-checks"
name = "dagayn-vscode (fmt/lint/test/test:compile)"
language = "system"
entry = "dagayn-vscode/scripts/checks.sh"
pass_filenames = false
files = { glob = ["dagayn-vscode/**/*"] }
stages = ["pre-commit"]
priority = 0

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
entry = "uv run ruff format"
files = { glob = ["dagayn/**/*.py", "tests/**/*.py", "scripts/**/*.py", "main.py", "hatch_build.py"] }
priority = 0

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
language = "system"
entry = "uv run ruff check"
files = { glob = ["dagayn/**/*.py", "tests/**/*.py", "scripts/**/*.py", "main.py", "hatch_build.py"] }
priority = 10

[[repos.hooks]]
id = "ty-check"
name = "ty check"
language = "system"
entry = "uv run ty check dagayn --python-version 3.13 --ignore unresolved-import"
files = { glob = ["dagayn/**/*.py", "tests/**/*.py", "scripts/**/*.py", "main.py", "hatch_build.py"] }
pass_filenames = false
priority = 20

[[repos.hooks]]
id = "prefetch-grammars"
name = "prefetch pinned grammars"
language = "system"
entry = "uv run python -m dagayn.vendor_grammars"
pass_filenames = false
always_run = true
stages = ["pre-push"]
priority = 0

[[repos.hooks]]
id = "pytest"
name = "pytest"
language = "system"
entry = "uv run pytest --tb=short -q"
pass_filenames = false
always_run = true
stages = ["pre-push"]
priority = 10
